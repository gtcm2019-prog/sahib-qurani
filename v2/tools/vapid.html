<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Clés de notification</title>
<style>
  body { font-family: system-ui, sans-serif; background: #FAF6EF; color: #2B2418; margin: 0; padding: 24px 16px; }
  main { max-width: 640px; margin: 0 auto; background: #fff; border: 1px solid #E7DCC6; border-radius: 14px; padding: 20px; }
  h1 { color: #1B4D4A; font-size: 1.4rem; margin-top: 0; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; font: 13px monospace; padding: 10px; border: 1px solid #E7DCC6; border-radius: 8px; }
  button { padding: 10px 14px; border: 0; border-radius: 8px; background: #1B4D4A; color: #fff; font-weight: 600; cursor: pointer; }
  .warn { background: #FBEAEA; color: #B83A3A; padding: 10px 12px; border-radius: 8px; }
  .muted { color: #7A6548; font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Clés des notifications (VAPID)</h1>
  <p class="muted">Générées dans ce navigateur uniquement : elles ne sont envoyées nulle part.
    Copie-les dans Supabase → Edge Functions → Secrets, puis ferme cette page.</p>
  <p class="warn">Ne communique jamais la clé privée, ni dans le chat ni ailleurs.</p>

  <label for="pub">VAPID_PUBLIC_KEY</label>
  <div class="row"><input id="pub" readonly><button data-copy="pub">Copier</button></div>

  <label for="priv">VAPID_PRIVATE_KEY</label>
  <div class="row"><input id="priv" readonly><button data-copy="priv">Copier</button></div>

  <p class="muted" id="msg"></p>
</main>
<script>
(async () => {
  const b64u = b => btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const kp = await crypto.subtle.generateKey({ name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveBits']);
  document.getElementById('pub').value = b64u(new Uint8Array(await crypto.subtle.exportKey('raw', kp.publicKey)));
  document.getElementById('priv').value = (await crypto.subtle.exportKey('jwk', kp.privateKey)).d;
  document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
    const v = document.getElementById(b.dataset.copy).value;
    try { await navigator.clipboard.writeText(v); } catch (e) { document.getElementById(b.dataset.copy).select(); document.execCommand('copy'); }
    document.getElementById('msg').textContent = 'Copié : ' + (b.dataset.copy === 'pub' ? 'clé publique' : 'clé privée');
  }));
})();
</script>
</body>
</html>
