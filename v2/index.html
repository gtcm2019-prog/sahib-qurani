<!doctype html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B4D4A">
<meta name="description" content="Sahib Qurani – trouvez un partenaire pour mémoriser et réviser le Coran.">
<title>Sahib Qurani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="top">
  <div class="bismillah" lang="ar" dir="rtl">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
  <nav class="bar">
    <a href="#/" class="brand">
      <span class="brand-mark" aria-hidden="true">۞</span>
      <span class="brand-text"><strong>Sahib Qurani</strong><small lang="ar" dir="rtl">صاحب القرآن</small></span>
    </a>
    <div class="bar-actions">
      <select id="lang-select" data-i18n-aria="footer.lang">
        <option value="ar">العربية</option>
        <option value="fr">Français</option>
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <a href="#/login" class="btn btn-ghost" data-auth="out" data-i18n="nav.login"></a>
      <a href="#/admin" class="btn btn-ghost btn-admin" data-admin hidden><span data-i18n="nav.admin"></span> <span class="count adm-count" hidden></span></a>
      <a href="#/profile" class="btn btn-ghost" data-auth="in" data-i18n="nav.account" hidden></a>
    </div>
  </nav>
</header>

<main>

  <!-- ACCUEIL -->
  <section data-view="home">
    <div class="hero">
      <h1 data-i18n="home.title"></h1>
      <p class="lead" data-i18n="home.subtitle"></p>
      <div class="cta">
        <a href="#/signup" class="btn btn-gold" data-auth="out" data-i18n="home.cta_start"></a>
        <a href="#/login" class="btn btn-line" data-auth="out" data-i18n="home.cta_login"></a>
        <a href="#/search" class="btn btn-gold" data-auth="in" data-i18n="search.title" hidden></a>
      </div>
      <p id="stats" class="stats" hidden></p>
    </div>

    <div class="card">
      <h2 class="sec" data-i18n="guide.title"></h2>
      <ol class="steps">
        <li><b data-i18n="guide.s1t"></b><span data-i18n="guide.s1d"></span></li>
        <li><b data-i18n="guide.s2t"></b><span data-i18n="guide.s2d"></span></li>
        <li><b data-i18n="guide.s3t"></b><span data-i18n="guide.s3d"></span></li>
        <li><b data-i18n="guide.s4t"></b><span data-i18n="guide.s4d"></span></li>
        <li><b data-i18n="guide.s5t"></b><span data-i18n="guide.s5d"></span></li>
        <li><b data-i18n="guide.s6t"></b><span data-i18n="guide.s6d"></span></li>
      </ol>
    </div>

    <figure class="card hadith">
      <p class="hadith-ar" lang="ar" dir="rtl">«تَعَاهَدُوا هَذَا الْقُرْآنَ، فَوَالَّذِي نَفْسُ مُحَمَّدٍ بِيَدِهِ لَهُوَ أَشَدُّ تَفَلُّتًا مِنَ الإِبِلِ فِي عُقُلِهَا»</p>
      <p class="hadith-tr" data-i18n="hadith.text"></p>
      <figcaption data-i18n="hadith.src"></figcaption>
    </figure>
  </section>

  <!-- CONNEXION -->
  <section data-view="login" hidden>
    <form id="form-login" class="card auth" novalidate>
      <h2 data-i18n="auth.login_title"></h2>
      <button type="button" class="btn btn-google"><span class="g" aria-hidden="true">G</span><span data-i18n="auth.google"></span></button>
      <div class="or"><span data-i18n="auth.or"></span></div>
      <label><span data-i18n="auth.email"></span><input name="email" type="email" dir="ltr" autocomplete="email" required></label>
      <label><span data-i18n="auth.password"></span>
        <span class="pw"><input name="password" type="password" dir="ltr" autocomplete="current-password" required><button type="button" class="pw-toggle" aria-label="👁">👁</button></span>
      </label>
      <p class="msg" role="alert" hidden></p>
      <p id="resend-wrap" hidden><button type="button" id="btn-resend" class="link" data-i18n="auth.resend"></button></p>
      <button type="submit" class="btn btn-gold" data-i18n="auth.login_btn"></button>
      <p class="links"><a href="#/forgot" data-i18n="auth.forgot_link"></a><a href="#/signup" data-i18n="auth.no_account"></a></p>
    </form>
  </section>

  <!-- INSCRIPTION -->
  <section data-view="signup" hidden>
    <form id="form-signup" class="card auth" novalidate>
      <h2 data-i18n="auth.signup_title"></h2>
      <button type="button" class="btn btn-google"><span class="g" aria-hidden="true">G</span><span data-i18n="auth.google"></span></button>
      <div class="or"><span data-i18n="auth.or"></span></div>
      <label><span data-i18n="auth.email"></span><input name="email" type="email" dir="ltr" autocomplete="email" required></label>
      <label><span data-i18n="auth.password"></span>
        <span class="pw"><input name="password" type="password" dir="ltr" autocomplete="new-password" required><button type="button" class="pw-toggle" aria-label="👁">👁</button></span>
        <small class="hint" data-i18n="auth.pw_rule"></small>
      </label>
      <label><span data-i18n="auth.password_confirm"></span><input name="password2" type="password" dir="ltr" autocomplete="new-password" required></label>
      <p class="msg" role="alert" hidden></p>
      <button type="submit" class="btn btn-gold" data-i18n="auth.signup_btn"></button>
      <p class="links"><a href="#/login" data-i18n="auth.have_account"></a></p>
    </form>
  </section>

  <!-- MOT DE PASSE OUBLIÉ -->
  <section data-view="forgot" hidden>
    <form id="form-forgot" class="card auth" novalidate>
      <h2 data-i18n="auth.forgot_title"></h2>
      <p class="muted" data-i18n="auth.forgot_text"></p>
      <label><span data-i18n="auth.email"></span><input name="email" type="email" dir="ltr" autocomplete="email" required></label>
      <p class="msg" role="alert" hidden></p>
      <button type="submit" class="btn btn-gold" data-i18n="auth.forgot_btn"></button>
      <p class="links"><a href="#/login" data-i18n="auth.back_login"></a></p>
    </form>
  </section>

  <!-- NOUVEAU MOT DE PASSE -->
  <section data-view="reset" hidden>
    <form id="form-reset" class="card auth" novalidate>
      <h2 data-i18n="auth.reset_title"></h2>
      <label><span data-i18n="auth.password_new"></span>
        <span class="pw"><input name="password" type="password" dir="ltr" autocomplete="new-password" required><button type="button" class="pw-toggle" aria-label="👁">👁</button></span>
        <small class="hint" data-i18n="auth.pw_rule"></small>
      </label>
      <label><span data-i18n="auth.password_confirm"></span><input name="password2" type="password" dir="ltr" autocomplete="new-password" required></label>
      <p class="msg" role="alert" hidden></p>
      <button type="submit" class="btn btn-gold" data-i18n="auth.reset_btn"></button>
    </form>
  </section>

  <!-- MON PROFIL -->
  <section data-view="profile" hidden>
    <p id="profile-loading" class="muted center" data-i18n="common.loading"></p>
    <div id="profile-card" class="card profile" hidden>
      <div id="p-public"></div>

      <div class="p-private">
        <span class="lock" aria-hidden="true">🔒</span>
        <div><b id="p-wa"></b><small class="muted" data-i18n="profile.wa_private"></small></div>
      </div>

      <div class="p-controls">
        <div>
          <span class="ctl-label" data-i18n="profile.status"></span>
          <div class="seg" id="seg-status">
            <button type="button" data-status="searching" data-i18n="status.searching"></button>
            <button type="button" data-status="found" data-i18n="status.found"></button>
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" id="chk-pause">
          <span class="slider" aria-hidden="true"></span>
          <span><b data-i18n="profile.pause"></b><small class="muted" data-i18n="profile.pause_hint"></small></span>
        </label>
      </div>
      <p class="msg" role="alert" hidden></p>

      <div id="p-reviews" class="trust"></div>

      <div class="p-actions">
        <a href="#/edit" class="btn btn-gold" data-i18n="profile.edit"></a>
        <button type="button" id="btn-logout" class="btn btn-line" data-i18n="nav.logout"></button>
      </div>
    </div>

    <div id="account-card" class="card profile" hidden>
      <h3 data-i18n="safe.blocked_title"></h3>
      <div id="p-blocks" class="block-list"></div>
      <div class="danger">
        <h3 data-i18n="acct.delete_title"></h3>
        <p class="muted" data-i18n="acct.delete_text"></p>
        <button type="button" id="btn-delete" class="btn btn-danger" data-i18n="acct.delete_btn"></button>
      </div>
    </div>
  </section>

  <!-- CRÉER / MODIFIER LE PROFIL -->
  <section data-view="edit" hidden>
    <form id="form-profile" class="card form-profile" novalidate>
      <h2 id="edit-title"></h2>
      <p class="muted" data-i18n="edit.intro"></p>

      <fieldset>
        <legend data-i18n="edit.sec_about"></legend>
        <label><span data-i18n="edit.first_name"></span><input name="first_name" maxlength="50" autocomplete="given-name" required></label>
        <div class="field"><span class="lbl" data-i18n="edit.gender"></span>
          <div class="chips" id="f-gender"></div>
          <small class="hint" id="gender-lock" data-i18n="edit.gender_locked" hidden></small></div>
        <div class="field"><span class="lbl" data-i18n="edit.avatar"></span>
          <div class="avatars" id="f-avatar"></div></div>
        <label><span data-i18n="edit.age_range"></span><select name="age_range" required></select></label>
        <div class="grid2">
          <label><span data-i18n="edit.country"></span><select name="country" required></select></label>
          <label><span data-i18n="edit.city"></span><input name="city" maxlength="80" autocomplete="address-level2"></label>
        </div>
        <div class="field"><span class="lbl" data-i18n="edit.languages"></span>
          <div class="chips chips-wrap" id="f-languages"></div></div>
      </fieldset>

      <fieldset>
        <legend data-i18n="edit.sec_quran"></legend>
        <div class="grid2">
          <label><span data-i18n="edit.level"></span><select name="level" required></select></label>
          <div class="field"><span class="lbl" data-i18n="edit.riwaya"></span><div class="chips" id="f-riwaya"></div></div>
        </div>
        <label><span data-i18n="edit.hizb"></span>
          <div class="hizb"><input type="range" name="hizb_memorized" min="0" max="60" step="1" value="0"><output id="hizb-out">0</output></div>
        </label>
        <div class="field"><span class="lbl" data-i18n="edit.surahs"></span>
          <div class="grid2">
            <label class="sub"><span data-i18n="edit.from"></span><select name="surah_from"></select></label>
            <label class="sub"><span data-i18n="edit.to"></span><select name="surah_to"></select></label>
          </div></div>
      </fieldset>

      <fieldset>
        <legend data-i18n="edit.sec_contact"></legend>
        <div class="field"><span class="lbl" data-i18n="edit.availability"></span><div class="chips" id="f-availability"></div></div>
        <label><span data-i18n="edit.contact_mode"></span><select name="contact_mode" required></select></label>
        <label id="wa-own"><span data-i18n="edit.whatsapp"></span><input name="whatsapp" type="tel" dir="ltr" inputmode="tel" placeholder="+212 6 12 34 56 78" autocomplete="tel">
          <small class="hint" data-i18n="edit.whatsapp_hint"></small></label>
        <div id="guardian" class="guardian" hidden>
          <p class="note" data-i18n="edit.guardian_note"></p>
          <label><span data-i18n="edit.guardian_name"></span><input name="guardian_name" maxlength="80"></label>
          <label><span data-i18n="edit.guardian_whatsapp"></span><input name="guardian_whatsapp" type="tel" dir="ltr" inputmode="tel" placeholder="+212 6 12 34 56 78"></label>
        </div>
      </fieldset>

      <p class="msg" role="alert" hidden></p>
      <div class="p-actions">
        <button type="submit" class="btn btn-gold" data-i18n="edit.save"></button>
        <a href="#/profile" id="edit-cancel" class="btn btn-line" data-i18n="edit.cancel"></a>
      </div>
    </form>
  </section>

  <!-- RECHERCHE -->
  <section data-view="search" hidden>
    <form id="form-search" class="card filters" novalidate>
      <div class="f-head">
        <h2 data-i18n="search.title"></h2>
        <button type="button" id="btn-filters" class="btn btn-line btn-sm" aria-expanded="false" data-i18n="search.filters"></button>
      </div>
      <p class="note-soft" data-i18n="search.same_gender_rule"></p>
      <div id="filters-more" class="f-grid" hidden>
        <label><span data-i18n="edit.age_range"></span><select name="age_range"></select></label>
        <label><span data-i18n="edit.level"></span><select name="level"></select></label>
        <label><span data-i18n="edit.riwaya"></span><select name="riwaya"></select></label>
        <label><span data-i18n="search.hizb_min"></span><select name="hizb_min"></select></label>
        <label><span data-i18n="edit.contact_mode"></span><select name="contact_mode"></select></label>
        <label><span data-i18n="search.time"></span><select name="availability"></select></label>
        <label><span data-i18n="edit.country"></span><select name="country"></select></label>
        <label><span data-i18n="search.language"></span><select name="language"></select></label>
        <label><span data-i18n="profile.status"></span><select name="status"></select></label>
      </div>
      <div class="p-actions">
        <button type="submit" class="btn btn-gold" data-i18n="search.go"></button>
        <button type="button" id="btn-reset-filters" class="link" data-i18n="search.reset"></button>
      </div>
    </form>
    <p id="search-count" class="muted center" hidden></p>
    <div id="results" class="results"></div>
    <p class="center"><button type="button" id="btn-more" class="btn btn-line" data-i18n="search.more" hidden></button></p>
  </section>

  <!-- FICHE D'UN MEMBRE -->
  <section data-view="member" hidden>
    <p><a href="#/search" class="back" data-i18n="member.back"></a></p>
    <p id="member-loading" class="muted center" data-i18n="common.loading"></p>
    <div id="member-card" class="card profile" hidden>
      <div id="m-public"></div>
      <div id="m-relation" class="relation"></div>
      <div id="m-trust" class="trust"></div>
      <p class="msg" role="alert" hidden></p>
    </div>
  </section>

  <!-- MES DEMANDES -->
  <section data-view="requests" hidden>
    <div class="card">
      <h2 data-i18n="req.title"></h2>
      <div class="seg seg-full" id="seg-req">
        <button type="button" data-box="in" class="on"><span data-i18n="req.received"></span> <span class="count" id="count-in" hidden></span></button>
        <button type="button" data-box="out" data-i18n="req.sent"></button>
      </div>
      <p id="req-loading" class="muted center" data-i18n="common.loading"></p>
      <div id="req-list" class="req-list"></div>
      <p class="msg" role="alert" hidden></p>
    </div>
  </section>

  <!-- ESPACE ADMIN -->
  <section data-view="admin" hidden>
    <div class="card adm">
      <h2 data-i18n="admin.title"></h2>
      <div class="seg seg-full seg-scroll" id="seg-admin">
        <button type="button" data-tab="reports" class="on"><span data-i18n="admin.t_reports"></span> <span class="count adm-count" hidden></span></button>
        <button type="button" data-tab="members" data-i18n="admin.t_members"></button>
        <button type="button" data-tab="reviews" data-i18n="admin.t_reviews"></button>
        <button type="button" data-tab="stats" data-i18n="admin.t_stats"></button>
      </div>
      <div data-adm-tools="reports" class="adm-tools">
        <label><span data-i18n="admin.filter"></span>
          <select id="adm-rep-filter">
            <option value="open" data-i18n="admin.rs_open"></option>
            <option value="reviewed" data-i18n="admin.rs_reviewed"></option>
            <option value="actioned" data-i18n="admin.rs_actioned"></option>
            <option value="dismissed" data-i18n="admin.rs_dismissed"></option>
            <option value="all" data-i18n="search.any"></option>
          </select></label>
      </div>
      <form id="adm-member-form" data-adm-tools="members" class="adm-tools" hidden novalidate>
        <label><span data-i18n="edit.first_name"></span><input id="adm-q" type="search" dir="auto"></label>
        <label><span data-i18n="admin.badge"></span>
          <select id="adm-badge">
            <option value="" data-i18n="search.any"></option>
            <option value="none" data-i18n="admin.no_badge"></option>
            <option value="reliable" data-i18n="badge.reliable"></option>
            <option value="warning" data-i18n="badge.warning"></option>
            <option value="banned" data-i18n="badge.banned"></option>
          </select></label>
        <button type="submit" class="btn btn-gold btn-sm" data-i18n="search.go"></button>
      </form>
      <div id="adm-content" class="adm-content"></div>
    </div>
    <dialog id="adm-dialog" class="adm-dialog">
      <button type="button" id="adm-dialog-close" class="dlg-close" aria-label="×">×</button>
      <div id="adm-dialog-body"></div>
    </dialog>
  </section>

</main>

<nav class="tabs" data-auth="in" hidden>
  <a href="#/search" data-tab="search"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span><span data-i18n="nav.search"></span></a>
  <a href="#/requests" data-tab="requests"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></span><span data-i18n="nav.requests"></span><span class="count" id="tab-count" hidden></span></a>
  <a href="#/profile" data-tab="profile"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span><span data-i18n="nav.profile"></span></a>
</nav>

<footer class="foot">
  <span class="star" aria-hidden="true">✦</span>
  <p data-i18n="footer.text"></p>
</footer>

<script type="module" src="js/app.js"></script>
</body>
</html>
